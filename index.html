<!doctype html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Buy Yusuf a coffee ☕</title>
   <meta name="description" content="Buy Yusuf a coffee with Ethereum — connect MetaMask or scan the QR." />
   <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"
      integrity="sha384-Htz1SE4Sl5aitpvFgr2j0sfsGUIuSXI6t8hEyrlQ93zflEF3a29bH2AvkUROUw7J"
      crossorigin="anonymous" referrerpolicy="no-referrer"></script>
   <link rel="stylesheet" href="main.css" />
</head>

<body>
   <main class="card">
      <div class="coffee" aria-hidden="true">☕</div>
      <h1>Buy me a coffee</h1>
      <p class="subtitle">A small thank-you in ETH. 0.001 Ξ ≈ one flat white.</p>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <!-- Desktop / browser-extension flow -->
      <div id="desktop" hidden>
         <button class="btn btn-primary" id="connectMetaMaskButton">
            <span class="fox">🦊</span> Connect MetaMask
         </button>
         <button class="btn btn-pay" id="buyButton" disabled>Send 0.001 Ξ</button>
         <div id="account" class="account" hidden>
            Connected: <span id="metaAccount" class="mono"></span>
         </div>
      </div>

      <!-- Mobile deep-link flow -->
      <div id="mobile" hidden>
         <button class="btn btn-primary" id="redirectButton">
            <span class="fox">🦊</span> Open in MetaMask app
         </button>
      </div>

      <div class="divider"><span>or scan to pay</span></div>
      <img class="qr" src="qr.png" alt="QR code to send ETH to Yusuf's wallet" width="180" height="180" />

      <p class="addr">
         <span class="mono" id="payAddress">0xd583…e54A</span>
         <button class="copy" id="copyAddress" title="Copy full address">Copy</button>
      </p>
   </main>

   <footer>Made with ☕ by <a href="https://yusuf.kaka.co.za" target="_blank" rel="noopener noreferrer">Yusuf Kaka</a></footer>

   <script src="main.js"></script>
</body>

</html>
